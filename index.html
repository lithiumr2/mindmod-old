<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindustry Hjson Studio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#21252b">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="logo-icon">⚡</span>
            <h1>Mindustry Hjson Studio</h1>
        </div>
        <div class="header-actions">
            <a href="https://mindustrygame.github.io/wiki/" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" title="Mindustry Official Wiki">
                <span>Wiki / Docs</span>
            </a>
            <button id="export-zip-btn" class="btn btn-primary btn-sm" disabled>Export (.zip)</button>
        </div>
    </header>

    <main class="app-layout">
        <!-- Dashboard View: Project Management -->
        <section id="dashboard-view" class="view-section active">
            <div class="dashboard-controls">
                <h2>Project Workspace</h2>
                <div class="action-bar">
                    <button id="btn-new-project" class="btn btn-primary">+ New Mod Project</button>
                    <button id="btn-import-project" class="btn btn-secondary">Import Mod (.zip)</button>
                </div>
            </div>

            <div id="project-list" class="project-grid">
                <!-- Projects rendered dynamically via db.js -->
            </div>
        </section>

        <!-- Workspace View: File Editor -->
        <section id="workspace-view" class="view-section">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <button id="btn-back-dashboard" class="btn btn-icon" title="Return to Dashboard">←</button>
                    <span id="active-project-name" class="project-title">Project Name</span>
                </div>
                
                <div class="tree-actions">
                    <button id="btn-add-hjson" class="btn btn-outline btn-xs">+ Hjson Element</button>
                    <button id="btn-add-sprite" class="btn btn-outline btn-xs">+ Sprite Image</button>
                    <button id="btn-add-script" class="btn btn-outline btn-xs">+ Script (.js)</button>
                </div>

                <nav id="file-tree" class="file-tree-container">
                    <!-- Virtual File System Tree -->
                </nav>
            </aside>

            <section class="editor-stage">
                <div id="editor-tabs" class="tab-bar">
                    <!-- Open file tabs -->
                </div>
                <div id="editor-content" class="editor-viewport">
                    <div class="empty-state">
                        <p>Select a file from the workspace tree to start editing.</p>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <!-- Modal: New Project -->
    <dialog id="modal-new-project" class="app-modal">
        <form id="form-new-project" method="dialog">
            <h3>Create New Mindustry Mod</h3>
            <div class="form-group">
                <label for="mod-name">Mod Name *</label>
                <input type="text" id="mod-name" required placeholder="e.g., Titanium Tech">
            </div>
            <div class="form-group">
                <label for="mod-author">Author *</label>
                <input type="text" id="mod-author" required placeholder="e.g., ModderName">
            </div>
            <div class="form-group">
                <label for="mod-description">Description</label>
                <textarea id="mod-description" rows="3" placeholder="Brief overview of your mod..."></textarea>
            </div>
            <div class="form-group">
                <label for="mod-version">Version</label>
                <input type="text" id="mod-version" value="1.0" placeholder="1.0">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal-new-project').close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Workspace</button>
            </div>
        </form>
    </dialog>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/hjson-engine.js"></script>
    <script src="js/code-editor.js"></script>
    <script src="js/sprite-engine.js"></script>
    <script src="js/zip-exporter.js"></script>
    <script src="js/ui-controller.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
