<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindmod IDE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#21252b">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Mindmod IDE</h1>
    </div>
    <div class="header-actions">
      <a href="https://mindustrygame.github.io/wiki/" target="_blank" class="btn btn-secondary">Wiki / Docs</a>
      <button id="export-zip-btn" class="btn btn-primary">Export (.zip)</button>
    </div>
  </header>

  <main class="app-layout">
    <aside class="sidebar">
      <button id="new-element-btn" class="btn btn-accent">+ New Element</button>
      
      <div class="tools-menu" style="display: flex; flex-direction: column; gap: 8px; margin-top: 15px;">
        <button id="mod-json-btn" class="btn btn-secondary">mod.json</button>
        <button id="audit-mod-btn" class="btn btn-secondary">Audit Mod</button>
        <button id="view-sprites-btn" class="btn btn-secondary">View Textures</button>
        <button id="backup-project-btn" class="btn btn-secondary">Save Backup</button>
        
        <label for="import-project-file" class="btn btn-secondary" style="cursor:pointer; text-align:center; display:block;">
          Load Backup
        </label>
        <input type="file" id="import-project-file" accept=".mindmod" style="display:none;">
        
        <button id="add-prop-btn" class="btn btn-secondary">+ Add Property</button>
      </div>

      <ul id="file-list" class="file-list" style="margin-top: 20px;"></ul>
    </aside>

    <section class="editor-area">
      <div class="editor-toolbar">
         <button id="toggle-view-btn" class="btn btn-secondary">View Code</button>
         <span id="status-indicator" style="margin-left: 15px; color: #a0a0b0; font-size: 12px;">Ready</span>
      </div>
      
      <div id="visual-panel" class="panel">
        <div id="form-container"></div>
      </div>
      
      <div id="code-panel" class="panel hidden">
        <textarea id="code-editor" spellcheck="false" style="width:100%; height:100%; background:#1e1e24; color:#fff;"></textarea>
      </div>
    </section>
  </main>

  <!-- Carga de scripts en el orden correcto -->
  <script src="js/hjson-engine.js"></script>
  <script src="js/db.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/item-registry.js"></script>
  <script src="js/block-templates.js"></script>
  <script src="js/bullet-editor.js"></script>
  <script src="js/mod-manager.js"></script>
  <script src="js/mod-validator.js"></script>
  <script src="js/code-editor.js"></script>
  <script src="js/sprite-viewer.js"></script>
  <script src="js/project-backup.js"></script>
  <script src="js/ui-controller.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
